name: Sync to Hugging Face Space

# Auto-mirrors every push to GitHub `main` into the Hugging Face Space,
# which then rebuilds and redeploys itself.
#
# ONE-TIME SETUP before this works:
#   1. Create the Space on huggingface.co (Streamlit SDK).
#   2. Create an HF access token with WRITE scope.
#   3. In this GitHub repo: Settings -> Secrets and variables -> Actions
#      add a secret named  HF_TOKEN  with that token.
#   4. Fill in HF_USERNAME and SPACE_NAME below.

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a sync manually from the Actions tab

env:
  HF_USERNAME: your-hf-username     # <-- CHANGE THIS
  SPACE_NAME: pneumonia-detection   # <-- CHANGE THIS to your Space's name

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (including LFS objects)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history, required to push to HF
          lfs: true         # pull the .pth / .jpeg LFS files

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git lfs install
          git remote add hf "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${SPACE_NAME}"
          # Push code, then make sure all LFS objects land on the Space too.
          git push --force hf main
          git lfs push --all hf
